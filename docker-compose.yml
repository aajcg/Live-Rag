services:
  rag-engine:
    build: .
    container_name: streaming-live-rag
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATA_DIR=data
      - INDEX_DIR=data/index
      - CHROMA_DIR=data/chroma
      - LOG_DIR=logs
      - ENABLE_RERANKER=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
